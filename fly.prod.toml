# Ambiente PROD. Deploy: fly deploy --config fly.prod.toml --app compraventa-backend-prod
# Solo se despliega acá después de que main recibe el merge desde dev ya
# probado (ver README/CONTRIBUTING para el flujo de ramas).
#
# `min_machines_running = 1`: siempre encendida (sin cold start para
# clientes reales) — a diferencia de dev, que escala a cero. Un
# shared-cpu-1x/256MB siempre encendido cuesta ~$2/mes de cómputo (más
# ancho de banda); subir a 512MB si el uso real lo pide (`fly scale vm`).
#
# `bog` (Bogotá) está deprecada en Fly y ya no acepta recursos nuevos —
# `gru` (São Paulo) es la región de Sudamérica más cercana disponible hoy.
#
# Secretos (nunca acá — este ambiente necesita su PROPIO proyecto Supabase
# "prod", todavía no creado — ver docs/ARCHITECTURE.md §8):
#   fly secrets set -a compraventa-backend-prod \
#     DATABASE_URL=... SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
#
# Job nocturno (mismo criterio que fly.dev.toml: NO va en [processes] para
# no dejarlo corriendo 24/7 — se crea como Fly Machine programada aparte,
# una vez que el proceso `web` ya esté desplegado):
#   fly machine run registry.fly.io/compraventa-backend-prod:latest \
#     --app compraventa-backend-prod --region gru --vm-size shared-cpu-1x \
#     --schedule daily -- python -m app.jobs.nightly
#
# (el `--` importa: sin él, flyctl interpreta el `-m` de `python -m` como su
# propia flag `--metadata` y falla)
#
# `[[http_service.checks]]` sí tiene sentido acá (a diferencia de
# fly.dev.toml): prod no escala a cero, así que un check activo no le cuesta
# nada extra y sí detecta caídas para reemplazar la máquina.

app = "compraventa-backend-prod"
primary_region = "gru"

[build]

[env]
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"
