# Ambiente DEV. Deploy: fly deploy --config fly.dev.toml --app compraventa-backend-dev
#
# `auto_stop_machines = true` + `min_machines_running = 0`: la máquina se
# apaga sola sin tráfico y arranca de nuevo con el siguiente request (unos
# segundos de cold start). Billing de Fly es por segundo mientras corre —
# en un ambiente de pruebas con uso intermitente esto puede quedar en
# centavos al mes en vez de los ~$2-6/mes de un shared-cpu-1x siempre
# encendido. Ver docs/ARCHITECTURE.md §8 para el resto del análisis de costos.
#
# A PROPÓSITO sin `[[http_service.checks]]` acá (sí los tiene fly.prod.toml):
# un health check activo cuenta como tráfico real para el proxy de Fly, así
# que la máquina NUNCA se apaga con uno configurado — se confirmó en vivo
# (logs con un GET /api/v1/health cada 15s, machine sin parar nunca). En
# dev el costo importa más que la detección activa de caídas.
#
# `bog` (Bogotá) está deprecada en Fly y ya no acepta recursos nuevos —
# `gru` (São Paulo) es la región de Sudamérica más cercana disponible hoy.
#
# Secretos (nunca acá — el DATABASE_URL de este ambiente apunta al proyecto
# Supabase "dev", driyubkodnsqxbtxcmaz, ya existente):
#   fly secrets set -a compraventa-backend-dev \
#     DATABASE_URL=... SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
#
# Job nocturno (mismo patrón que prod, ver fly.prod.toml y
# docs/ARCHITECTURE.md §11): NO va en [processes] a propósito — si lo
# declarás ahí, `fly deploy` intenta mantener una máquina "nightly" viva
# todo el tiempo (le suma cómputo 24/7 a un job que solo debe correr una
# vez al día). En cambio se crea como una Fly Machine programada,
# independiente del fleet que gestiona `fly deploy`, apuntando a la misma
# imagen ya construida:
#   fly machine run registry.fly.io/compraventa-backend-dev:latest \
#     --app compraventa-backend-dev --region gru --vm-size shared-cpu-1x \
#     --schedule daily -- python -m app.jobs.nightly
#
# (el `--` importa: sin él, flyctl interpreta el `-m` de `python -m` como su
# propia flag `--metadata` y falla; con el comando entre comillas como un
# solo string, en cambio, systemd/init lo busca como UN binario literal
# "python -m app.jobs.nightly" y no existe — ambos fallaron en la práctica
# antes de encontrar `-- python -m app.jobs.nightly` con tokens separados)

app = "compraventa-backend-dev"
primary_region = "gru"

[build]

[env]
  ENVIRONMENT = "dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
