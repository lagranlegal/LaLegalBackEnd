name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q tests/unit

  integration:
    # La base de la integración la levanta el CLI de Supabase (`supabase db
    # start`), no un `postgres:NN` pelado: las migraciones dan permisos a
    # roles que solo existen en la imagen de Supabase (`supabase_auth_admin`
    # en 00003, `authenticated`/`anon`/`service_role` desde 00062/00064) y
    # tocan los esquemas `auth`/`storage`. Con Postgres pelado el paso de
    # migraciones moría en 00003 ("role supabase_auth_admin does not exist")
    # en cada push. `db start` arranca SOLO el contenedor de Postgres (sin
    # Auth, REST ni Studio: ~15 s), aplica `supabase/migrations/` y
    # `supabase/seed.sql` igual que `supabase start` en local, y deja la base
    # en 127.0.0.1:54322 — el default de tests/conftest.py. Ver
    # docs/OPERACION.md, sección "CI".
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_JWKS_URL: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
      JWT_AUDIENCE: authenticated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          # La misma versión que corre en local; subirla es una decisión, no
          # un efecto colateral de que salga una nueva.
          version: 2.30.4
      - run: pip install -e ".[dev]"
      - name: Levantar Postgres de Supabase con migraciones + seed
        run: |
          # Sin proyecto enlazado, el CLI usaría su imagen por defecto. La
          # fijamos a la que usa la dev remota (y la local, que la toma del
          # enlace en supabase/.temp/, ignorado por git): así CI prueba contra
          # la misma versión de Postgres que producción.
          mkdir -p supabase/.temp
          echo "17.6.1.155" > supabase/.temp/postgres-version
          supabase db start
      - run: pytest -q tests/integration tests/rls
